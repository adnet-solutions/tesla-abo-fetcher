; Konfiguration für tesla_pc_invoices.py
; Kopieren nach config.ini und anpassen. Datei enthält Zugangsdaten -> chmod 600

[tesla]
; Fahrgestellnummer (steht in der Tesla-App unter Fahrzeug > Software oder im Fahrzeugschein, Feld E)
vin =
country = DE
language = de
locale = de_DE

[output]
; lokale Ablage der PDFs (true/false) – per --local / --no-local überschreibbar
local = true
directory = rechnungen
; Unterordner pro Jahr (rechnungen/2026/...)
year_subfolders = true
; Platzhalter: {date} {year} {month} {id} {id_full} {number}
filename = Tesla_PremiumConnectivity_{date}_{id}.pdf
; Weitergabe an GetMyInvoices: api | mail | none – per --gmi überschreibbar
gmi = api
; hier merkt sich das Skript Login-Token und erledigte Rechnungen
state_file = state.json

[gmi]
; GMI: rechtes Menü > "API-Zugriff" > API-Key
api_key =
document_type = INCOMING_INVOICE
; GMI liest Betrag, MwSt., Rechnungsnummer per OCR selbst aus
run_ocr = true
tags = Tesla, Premium Connectivity
note = Automatisch importiert: Tesla Premium Connectivity
; optional: Firma in GMI fest zuordnen (ID aus GMI), sonst erkennt GMI sie selbst
company_id =
; optional: Paid | Not paid | Unknown
payment_status = Paid

[mail]
; nur nötig bei gmi = mail
; Ziel: deine zentrale GMI-Importadresse (Briefumschlag-Symbol oben rechts in GMI)
to =
from = enrico.roga@adnet-solutions.de
smtp_host =
smtp_port = 587
; starttls | ssl | none
smtp_security = starttls
smtp_user =
smtp_password =
subject = Tesla Premium Connectivity Rechnung {date}
