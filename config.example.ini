; Konfiguration für tesla_pc_invoices.py
; Kopieren nach config.ini und anpassen. Datei enthält Zugangsdaten -> chmod 600

[tesla]
; Fahrgestellnummer (steht in der Tesla-App unter Fahrzeug > Software oder im Fahrzeugschein, Feld E)
vin =
country = DE
language = de
locale = de_DE

[output]
; lokale Ablage der PDFs (true/false) – per --local / --no-local überschreibbar
local = true
directory = rechnungen
; Unterordner pro Jahr (rechnungen/2026/...)
year_subfolders = true
; Platzhalter: {date} {year} {month} {id} {id_full} {number}
filename = Tesla_PremiumConnectivity_{date}_{id}.pdf
; Weitergabe an GetMyInvoices: api | mail | none – per --gmi überschreibbar
gmi = api
; hier merkt sich das Skript Login-Token und erledigte Rechnungen
state_file = state.json

[gmi]
; GMI: rechtes Menü > "API-Zugriff" > API-Key
api_key =
document_type = INCOMING_INVOICE
; GMI liest Betrag, MwSt., Rechnungsnummer per OCR selbst aus
run_ocr = true
tags = Tesla, Premium Connectivity
note = Automatisch importiert: Tesla Premium Connectivity
; optional: Firma in GMI fest zuordnen (ID aus GMI), sonst erkennt GMI sie selbst
company_id =
; optional: Paid | Not paid | Unknown
payment_status = Paid

[mail]
; nur nötig bei gmi = mail
; Ziel: deine zentrale GMI-Importadresse (Briefumschlag-Symbol oben rechts in GMI)
to =
from = enrico.roga@adnet-solutions.de
smtp_host =
smtp_port = 587
; starttls | ssl | none
smtp_security = starttls
smtp_user =
smtp_password =
subject = Tesla Premium Connectivity Rechnung {date}

[notify]
; Benachrichtigungen aufs Handy. Kanäle kommagetrennt: ha, pushover, whatsapp (leer = aus)
channels =
; Wann: new = neue Rechnungen verarbeitet, error = Fehler/Login abgelaufen,
;       update = neue Version (bei --check-update)
events = new, error, update

[notify_ha]
; Home Assistant von außen erreichbar machen ist NICHT nötig – im Heimnetz reicht die lokale Adresse
url = http://homeassistant.local:8123
; Variante A (empfohlen): direkt aufs iPhone über die Companion-App
; Token: HA > Profil > Sicherheit > Langlebige Zugangs-Token
token =
; Name des Notify-Dienstes, siehe HA > Entwicklerwerkzeuge > Aktionen > "notify."
service = notify.mobile_app_iphone
; Variante B: Webhook – dann token/service leer lassen und in HA eine Automation
; mit Webhook-Auslöser bauen (Daten: trigger.json.title / .message / .important)
webhook_id =
; bei https mit selbstsigniertem Zertifikat auf false
verify_ssl = true

[notify_pushover]
; pushover.net: User Key steht auf der Startseite, App-Token unter "Create an Application"
user_key =
app_token =
; 0 = normal, 1 = hoch (durchstellen auch bei Ruhezeit)
priority = 0
priority_error = 1
; optional nur an ein Gerät
device =

[notify_whatsapp]
; WhatsApp über CallMeBot (kostenlos, nur an die eigene Nummer, nur private Nutzung)
; Einrichtung: +34 623 78 95 95 als Kontakt speichern und per WhatsApp schicken:
;   I allow callmebot to send me messages
; Die Antwort enthält den apikey.
phone = +49
apikey =

[update]
; Quelle für --check-update / --update (Standard passt, nur bei Fork ändern)
repo = adnet-solutions/tesla-abo-fetcher
branch = main
; nur nötig, falls das Repo privat wird
github_token =
